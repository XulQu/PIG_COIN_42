<title>Mercury</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Doto:wght@500;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: one instrument panel. Dump box first, alerts pinned above it, then agenda and a dot-grid calendar. Dark-first, dot-matrix display type, one red signal colour. */
:root{
  --bg:#000; --surface:#0e0e0f; --raise:#18181a; --line:#2b2b2e; --fg:#f3f3f0; --muted:#8d8d88;
  --accent:#e0202a; --on-accent:#fff; --med:#f2b20c; --soft:#9db6cc;
  --display:"Doto","JetBrains Mono",ui-monospace,monospace;
  --body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){
  --bg:#e9e9e6; --surface:#f6f6f3; --raise:#fff; --line:#cbcbc6; --fg:#0a0a0a; --muted:#5c5c57;
  --accent:#c4161f; --on-accent:#fff; --med:#9a6500; --soft:#44627d; color-scheme:light } }
:root[data-theme="light"]{
  --bg:#e9e9e6; --surface:#f6f6f3; --raise:#fff; --line:#cbcbc6; --fg:#0a0a0a; --muted:#5c5c57;
  --accent:#c4161f; --on-accent:#fff; --med:#9a6500; --soft:#44627d; color-scheme:light }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45}
.wrap{max-width:640px;margin:0 auto;padding-block:16px 48px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));
  display:flex;flex-direction:column;gap:20px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.glyph{width:64px;height:64px;flex:none;border-radius:16px;background:#000;border:1px solid var(--line)}
.brand{flex:1;min-width:0}
.brand h1{font-family:var(--display);font-weight:800;font-size:34px;letter-spacing:.06em;margin:0;line-height:1}
.brand p{margin:4px 0 0;color:var(--muted);font-family:var(--mono);font-size:12px}
.clock{font-family:var(--display);font-weight:800;font-size:30px;font-variant-numeric:tabular-nums;letter-spacing:.04em}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pill{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--line);
  border-radius:99px;padding:5px 10px;color:var(--muted);background:none;display:inline-flex;align-items:center;gap:6px}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--muted)}
.pill.on{color:var(--fg)} .pill.on::before{background:var(--accent)}
button.pill{cursor:pointer}

.alert{border:1px solid var(--accent);background:var(--surface);border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;
  position:sticky;top:calc(env(safe-area-inset-top, 0px) + 8px);z-index:5}
.alert .k{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.alert.medium{border-color:var(--med)} .alert.medium .k{color:var(--med)}
.alert.light{border-color:var(--soft)} .alert.light .k{color:var(--soft)}
.alert .t{font-size:19px;font-weight:600;overflow-wrap:anywhere}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:4px}
.tab{border:0;background:none;border-radius:99px;padding:10px 4px;cursor:pointer;font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.tab.on{background:var(--fg);color:var(--bg)}
.btn.big{flex:1;padding:16px;font-size:16px}
#dump{min-height:38vh}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.stats .panel{display:flex;flex-direction:column;gap:2px}
.stats b{font-family:var(--display);font-weight:800;font-size:38px;line-height:1;font-variant-numeric:tabular-nums}
.stats span{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.stats .risk{color:var(--accent)}
.bar{height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);border-radius:99px;transition:width .4s}
.item.late .me{color:var(--accent)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom, 0px) + 20px);background:var(--fg);color:var(--bg);border-radius:99px;padding:10px 18px;font-family:var(--mono);font-size:12px;z-index:20;white-space:nowrap;max-width:calc(100% - 32px);overflow:hidden;text-overflow:ellipsis}
.grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:20px;align-items:start}
@media (max-width:760px){.grid{grid-template-columns:minmax(0,1fr)}}
.col{display:flex;flex-direction:column;gap:20px;min-width:0}
section{display:flex;flex-direction:column;gap:10px;min-width:0}
h2{font-family:var(--mono);font-weight:600;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0;
  display:flex;justify-content:space-between;align-items:center;gap:8px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px}

textarea{width:100%;min-height:96px;resize:vertical;background:var(--raise);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:16px}
.field{display:flex;flex-direction:column;gap:4px;flex:1;min-width:130px}
.field label{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
select,input[type=datetime-local]{background:var(--raise);border:1px solid var(--line);border-radius:10px;padding:9px 10px;width:100%;min-width:0;font-size:14px}
.btn{border:1px solid var(--line);background:var(--raise);border-radius:99px;padding:9px 16px;cursor:pointer;font-weight:500;font-size:14px}
.btn:hover{border-color:var(--fg)}
.btn.go{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.btn.sm{padding:5px 11px;font-size:12px}
.btn[disabled]{opacity:.5;cursor:default}
.say{font-size:14px;color:var(--fg);border-left:2px solid var(--accent);padding-left:10px;overflow-wrap:anywhere}
.hint{color:var(--muted);font-size:12.5px;margin:0}

.list{display:flex;flex-direction:column;gap:8px}
.item{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:10px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:11px 12px}
.dot{width:10px;height:10px;border-radius:50%;margin-top:5px;background:var(--soft)}
.dot.high{background:var(--accent)} .dot.medium{background:var(--med)}
.item .ti{font-weight:500;overflow-wrap:anywhere}
.item .me{font-family:var(--mono);font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.item .no{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.item.done .ti{text-decoration:line-through;color:var(--muted)}
.tag{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;border:1px dashed var(--line);border-radius:6px;padding:1px 5px;color:var(--muted)}
.acts{display:flex;gap:4px}
.ic{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:none;cursor:pointer;font-size:14px;line-height:1;color:var(--muted)}
.ic:hover{color:var(--fg);border-color:var(--fg)}
.empty{color:var(--muted);font-size:13.5px;border:1px dashed var(--line);border-radius:14px;padding:14px}

.calhead{display:flex;justify-content:space-between;align-items:center}
.calhead b{font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:.05em;text-transform:uppercase}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .wd{font-family:var(--mono);font-size:10px;color:var(--muted);text-align:center;letter-spacing:.08em;padding:4px 0}
.day{aspect-ratio:1;border:1px solid transparent;border-radius:10px;background:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums;padding:0}
.day:hover{border-color:var(--line)}
.day.out{color:var(--muted);opacity:.45}
.day.today{border-color:var(--fg)}
.day.sel{background:var(--fg);color:var(--bg)}
.day .ds{display:flex;gap:2px;height:5px}
.day .ds i{width:5px;height:5px;border-radius:50%;background:var(--soft)}
.day .ds i.high{background:var(--accent)} .day .ds i.medium{background:var(--med)}

details{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px 14px}
summary{cursor:pointer;font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
details[open] summary{margin-bottom:12px}
.tiers{display:flex;flex-direction:column;gap:10px}
.tier{display:grid;grid-template-columns:10px minmax(0,1fr);gap:10px;align-items:start}
.tier b{display:block} .tier small{color:var(--muted);display:block;margin-bottom:6px}
.log{font-family:var(--mono);font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:3px;font-variant-numeric:tabular-nums;max-height:160px;overflow:auto}
.jsonout{width:100%;min-height:120px;font-family:var(--mono);font-size:11px}
@media (prefers-reduced-motion:no-preference){ .alert{animation:pulse 1.6s ease-in-out infinite} @keyframes pulse{50%{box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 30%,transparent)}} }
</style>

<div class="wrap">
  <header class="top">
    <svg class="glyph" id="glyph" viewBox="0 0 26 26" role="img" aria-label="Winged shoe"></svg>
    <div class="brand">
      <h1>MERCURY</h1>
      <p id="lastSeen">Personal assistant</p>
    </div>
    <div class="clock" id="clock">--:--</div>
  </header>
  <div class="pills">
    <button class="pill" id="pArm" type="button">Sound off · tap to arm</button>
    <span class="pill" id="pClaude">Claude · checking</span>
    <button class="pill" id="pVoice" type="button">Voice</button>
  </div>

  <div id="alerts"></div>

  <nav class="tabs" role="tablist">
    <button class="tab" type="button" role="tab" data-tab="dump">Dump</button>
    <button class="tab" type="button" role="tab" data-tab="schedule">Tasks</button>
    <button class="tab" type="button" role="tab" data-tab="calendar">Calendar</button>
    <button class="tab" type="button" role="tab" data-tab="setup">Setup</button>
  </nav>

  <section id="tab-dump">
    <textarea id="dump" placeholder="Dentist Thursday 3pm, don't miss it. Later this week look at the lease renewal. Sam said try the ramen place on King St."></textarea>
    <div class="row">
      <button class="btn big" id="btnMic" type="button" hidden>Speak</button>
      <button class="btn big go" id="btnDump" type="button">File it</button>
    </div>
    <p class="hint" id="micHint">Voice input is not offered in this browser. Use the microphone key on your keyboard to dictate.</p>
    <div class="say" id="say" hidden></div>
  </section>

  <section id="tab-schedule" hidden>
    <div class="stats">
      <div class="panel"><b id="stToday">0</b><span>done today</span></div>
      <div class="panel"><b id="stStreak">0</b><span id="stStreakL">day streak</span></div>
    </div>
    <div class="bar" role="progressbar" aria-label="Today's tasks done"><i id="stBar"></i></div>
    <div id="tasks" style="display:flex;flex-direction:column;gap:10px"></div>
  </section>

  <section id="tab-calendar" hidden>
    <div class="panel" style="display:flex;flex-direction:column;gap:10px">
      <div class="calhead">
        <button class="ic" id="calPrev" type="button" aria-label="Previous month">‹</button>
        <b id="calTitle"></b>
        <button class="ic" id="calNext" type="button" aria-label="Next month">›</button>
      </div>
      <div class="cal" id="cal"></div>
    </div>
    <h2 id="dayTitle"></h2>
    <div class="list" id="dayList"></div>
  </section>

  <section id="tab-setup" hidden>
    <h2>Sounds</h2>
    <div class="panel">
      <div class="tiers" id="tiers"></div>
      <div class="row" style="margin-top:12px"><button class="btn sm" id="rewardTest" type="button">Hear the done chime</button></div>
      <p class="hint" style="margin-top:10px">Pick any audio file from your phone for each level. Clips up to 1.5 MB stay on this device.</p>
      <div class="row" id="voiceRow" style="margin-top:10px" hidden>
        <div class="field"><label for="voiceSel">Mercury's voice</label>
          <select id="voiceSel"><option value="buttery">Buttery</option><option value="airy">Airy</option><option value="glassy">Glassy</option><option value="rounded">Rounded</option></select></div>
        <button class="btn sm" id="voiceTest" type="button">Hear it</button>
      </div>
    </div>
    <h2>Memory</h2>
    <div class="panel">
      <p class="hint" id="memStat"></p>
      <div class="log" id="log" style="margin:8px 0"></div>
      <div class="row">
        <button class="btn sm" id="btnExport" type="button">Save mercury-memory.json</button>
        <label class="btn sm" for="importFile">Load a memory file</label>
        <input type="file" id="importFile" accept="application/json,.json" hidden>
        <button class="btn sm" id="btnClearEx" type="button" hidden>Clear examples</button>
      </div>
      <textarea class="jsonout" id="jsonOut" hidden readonly></textarea>
    </div>
  </section>
  <div id="toast" role="status" hidden></div>
</div>

<script>
(function(){
"use strict";
var KEY="mercury.memory.v1", SND="mercury.sound.";
var TIERS={
  high:{name:"High",desc:"Must not miss. Rings 15 minutes before and again on time.",lead:15},
  medium:{name:"Medium",desc:"Look out for later. Rings 1 hour before and on time.",lead:60},
  light:{name:"Light",desc:"Remember that someone told you. One soft chime on time.",lead:0}
};
var $=function(id){return document.getElementById(id)};
function el(tag,cls,text){var e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e}
function pad(n){return (n<10?"0":"")+n}
function localISO(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())+"T"+pad(d.getHours())+":"+pad(d.getMinutes())}
function dayKey(d){return localISO(d).slice(0,10)}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function fmtWhen(s){var d=new Date(s),n=new Date(),t=pad(d.getHours())+":"+pad(d.getMinutes());
  var diff=Math.round((new Date(dayKey(d))-new Date(dayKey(n)))/864e5);
  var day=diff===0?"Today":diff===1?"Tomorrow":diff===-1?"Yesterday":d.toLocaleDateString(undefined,{weekday:"short",day:"numeric",month:"short"});
  return day+" · "+t}
function fmtStamp(s){if(!s)return "—";var d=new Date(s);return d.toLocaleDateString(undefined,{day:"numeric",month:"short"})+" "+pad(d.getHours())+":"+pad(d.getMinutes())}

/* ---------- memory (JSON kept on this device) ---------- */
var state=null, storageOK=true;
function exampleItems(){var n=new Date();function at(dd,h,m){var d=new Date(n);d.setDate(d.getDate()+dd);d.setHours(h,m,0,0);return localISO(d)}
  return [
    {id:uid(),title:"Dentist check-up",note:"Bring the insurance card",when:at(1,15,0),tier:"high",example:true},
    {id:uid(),title:"Look at the lease renewal",note:"",when:at(3,10,0),tier:"medium",example:true},
    {id:uid(),title:"Sam said try the ramen place on King St",note:"",when:null,tier:"light",example:true}
  ].map(function(i){i.done=false;i.fired={};i.createdAt=new Date().toISOString();return i})}
function load(){
  try{var raw=localStorage.getItem(KEY);if(raw)state=JSON.parse(raw)}catch(e){storageOK=false}
  if(!state||!Array.isArray(state.items)){state={app:"Mercury",version:1,items:exampleItems(),sessions:[],settings:{voice:true,voiceName:"buttery"}}}
  state.sessions=state.sessions||[];state.settings=state.settings||{voice:true,voiceName:"buttery"};
}
function save(){state.updatedAt=new Date().toISOString();
  try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){storageOK=false}}
var session=null;
function openSession(){var prev=state.sessions[state.sessions.length-1];
  $("lastSeen").textContent=prev?("Last up "+fmtStamp(prev.opened)+" · shut down "+fmtStamp(prev.closed)):"First start-up on this device";
  session={opened:new Date().toISOString(),closed:new Date().toISOString()};
  state.sessions.push(session);if(state.sessions.length>200)state.sessions=state.sessions.slice(-200);save()}
function stampClose(){if(session){session.closed=new Date().toISOString();save()}}

/* ---------- sound ---------- */
var ctx=null, custom={};
function arm(){
  if(!ctx){var AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;try{ctx=new AC()}catch(e){return}
    Object.keys(TIERS).forEach(loadCustom)}
  if(ctx.state==="suspended")ctx.resume();
  $("pArm").textContent="Sound armed";$("pArm").classList.add("on");
  try{if(navigator.wakeLock)navigator.wakeLock.request("screen").catch(function(){})}catch(e){}
}
function tone(freq,start,dur,type,vol){var o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.value=freq;
  var t=ctx.currentTime+start;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+dur+.02)}
function playTier(tier){
  if(!ctx)return false;
  if(custom[tier]){var s=ctx.createBufferSource();s.buffer=custom[tier];s.connect(ctx.destination);s.start();return true}
  if(tier==="high"){for(var r=0;r<3;r++){tone(1320,r*.5,.09,"square",.22);tone(1760,r*.5+.12,.09,"square",.22);tone(2093,r*.5+.24,.14,"square",.22)}}
  else if(tier==="medium"){tone(660,0,.28,"sine",.3);tone(880,.3,.4,"sine",.3)}
  else{tone(1175,0,.5,"triangle",.16)}
  return true}
function b64ToBuf(b){var bin=atob(b),u=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u.buffer}
function loadCustom(tier){var raw=null;try{raw=localStorage.getItem(SND+tier)}catch(e){}
  if(!raw||!ctx)return;try{var o=JSON.parse(raw);ctx.decodeAudioData(b64ToBuf(o.data),function(buf){custom[tier]=buf},function(){})}catch(e){}}
function soundName(tier){try{var raw=localStorage.getItem(SND+tier);return raw?JSON.parse(raw).name:null}catch(e){return null}}
function setCustom(tier,file,done){
  if(file.size>1.5*1024*1024){done("That clip is over 1.5 MB. Pick a shorter one.");return}
  var fr=new FileReader();fr.onload=function(){arm();var buf=fr.result;
    var u=new Uint8Array(buf),s="";for(var i=0;i<u.length;i+=8192)s+=String.fromCharCode.apply(null,u.subarray(i,i+8192));
    var data=btoa(s);
    if(!ctx){done("This browser cannot play audio here.");return}
    ctx.decodeAudioData(buf.slice(0),function(ab){custom[tier]=ab;
      try{localStorage.setItem(SND+tier,JSON.stringify({name:file.name,data:data}));done(null)}
      catch(e){done("Playing now, but the phone refused to store it. It will reset when Mercury closes.")}
      playTier(tier)},function(){done("That file is not audio this browser can play. Try an mp3, ogg or wav.")})};
  fr.readAsArrayBuffer(file)}

/* ---------- voice ---------- */
var ttsCap=null;
function speak(text){
  if(!state.settings.voice||!text)return;
  if(ttsCap){ttsCap.speak(text.slice(0,1900),{voice:state.settings.voiceName||"buttery"}).catch(function(){});return}
  try{if(window.speechSynthesis){var u=new SpeechSynthesisUtterance(text),v=femaleVoice();if(v)u.voice=v;u.rate=.95;u.pitch=.95;
    window.speechSynthesis.cancel();window.speechSynthesis.speak(u)}}catch(e){}}
function femaleVoice(){var vs=window.speechSynthesis.getVoices().filter(function(v){return /^en/i.test(v.lang)}),
  pref=[/UK English Female/i,/Serena|Kate|Martha|Stephanie|Sonia|Libby|Hazel/i,/female/i,/Samantha|Karen|Moira|Tessa|Zira|Susan|Aria|Jenny/i];
  for(var p=0;p<pref.length;p++)for(var i=0;i<vs.length;i++)if(pref[p].test(vs[i].name))return vs[i];return null}
function paintVoice(){var can=!!ttsCap||!!window.speechSynthesis;
  $("pVoice").textContent=!can?"Voice unavailable here":state.settings.voice?"Voice on":"Voice off";
  $("pVoice").classList.toggle("on",can&&state.settings.voice);$("voiceRow").hidden=!ttsCap;$("voiceSel").value=state.settings.voiceName||"buttery"}

/* ---------- alarms ---------- */
var active=[];
function fire(item,kind,msg){
  active=active.filter(function(a){return a.id!==item.id});
  active.unshift({id:item.id,tier:item.tier,title:item.title,kind:kind,msg:msg,rings:1,last:Date.now()});
  playTier(item.tier);try{navigator.vibrate&&navigator.vibrate(item.tier==="high"?[200,80,200,80,400]:item.tier==="medium"?[200,100,200]:[120])}catch(e){}
  speak(msg);renderAlerts()}
function check(){
  var now=Date.now(),missed=[],dirty=false;
  state.items.forEach(function(it){
    if(it.done||it.example)return;it.fired=it.fired||{};
    if(it.snoozeUntil&&now>=new Date(it.snoozeUntil).getTime()){it.snoozeUntil=null;dirty=true;fire(it,"Snoozed",it.title+", again.")}
    if(!it.when)return;var t=new Date(it.when).getTime(),lead=TIERS[it.tier].lead*6e4;
    if(now>=t&&!it.fired.at){it.fired.at=true;it.fired.pre=true;dirty=true;
      if(now-t>5*6e4)missed.push(it);else fire(it,"Now",it.title+". Now.")}
    else if(lead&&now>=t-lead&&now<t&&!it.fired.pre){it.fired.pre=true;dirty=true;var m=Math.max(1,Math.round((t-now)/6e4));
      fire(it,"In "+m+" min",it.title+". "+m+" minute"+(m===1?"":"s")+".")}
  });
  if(missed.length){var top=missed.sort(function(a,b){return rank(a.tier)-rank(b.tier)})[0];
    var txt=missed.length===1?top.title:missed.length+" reminders, including "+top.title;
    active.unshift({id:"missed-"+now,tier:top.tier,title:txt,kind:"Passed while Mercury was closed",msg:"",rings:9,last:now});
    playTier(top.tier);speak("Missed: "+txt+".");renderAlerts()}
  active.forEach(function(a){if(a.tier==="high"&&a.rings<5&&now-a.last>30000){a.rings++;a.last=now;playTier("high")}});
  if(dirty){save();renderAll()}
}
function rank(t){return t==="high"?0:t==="medium"?1:2}
function renderAlerts(){var box=$("alerts");box.textContent="";
  active.slice(0,3).forEach(function(a){
    var d=el("div","alert "+a.tier);d.setAttribute("role","alert");d.appendChild(el("div","k",TIERS[a.tier].name+" · "+a.kind));d.appendChild(el("div","t",a.title));
    var r=el("div","row"),it=find(a.id);

    r.appendChild(btn("Dismiss","btn sm",function(){drop(a)}));d.appendChild(r);box.appendChild(d)})}

function btn(text,cls,fn){var b=el("button",cls,text);b.type="button";b.addEventListener("click",fn);return b}
function find(id){for(var i=0;i<state.items.length;i++)if(state.items[i].id===id)return state.items[i];return null}

var view=new Date(),selected=dayKey(new Date());

  var mid=el("div");var ti=el("div","ti",it.title+" ");if(it.example)ti.appendChild(el("span","tag","example"));mid.appendChild(ti);
  mid.appendChild(el("div","me",(it.when?fmtWhen(it.when):"No time slot")+" · "+TIERS[it.tier].name));
  if(it.note)mid.appendChild(el("div","no",it.note));d.appendChild(mid);

  var c=btn(it.done?"↺":"✓","ic",function(){setDone(it,!it.done)});c.setAttribute("aria-label",it.done?"Reopen":"Mark done");a.appendChild(c);

  d.appendChild(a);return d}
/* ---------- tasks, streak and the done reward ---------- */
function streak(){var dd=state.doneDays||{},d=new Date(),n=0;if(!dd[dayKey(d)])d.setDate(d.getDate()-1);
  while(dd[dayKey(d)]>0){n++;d.setDate(d.getDate()-1)}return n}
function renderTasks(){
  var now=localISO(new Date()),today=now.slice(0,10),open=state.items.filter(function(i){return !i.done});
  var timed=open.filter(function(i){return i.when}).sort(function(a,b){return a.when<b.when?-1:1});
  var groups=[["Overdue",timed.filter(function(i){return i.when<now})],
    ["Today",timed.filter(function(i){return i.when>=now&&i.when.slice(0,10)===today})],
    ["Later",timed.filter(function(i){return i.when.slice(0,10)>today})],
    ["Anytime",open.filter(function(i){return !i.when})],
    ["Done today",state.items.filter(function(i){return i.done&&i.doneAt&&dayKey(new Date(i.doneAt))===today})]];
  var box=$("tasks"),any=false;box.textContent="";
  groups.forEach(function(g){if(!g[1].length)return;any=true;box.appendChild(el("h2",null,g[0]));var l=el("div","list");g[1].forEach(function(i){l.appendChild(itemRow(i))});box.appendChild(l)});
  if(!any)box.appendChild(el("div","empty","No tasks. Dump a thought and it lands here."));
  var done=(state.doneDays||{})[today]||0,left=groups[0][1].length+groups[1][1].length,st=streak();
  $("stToday").textContent=done;$("stStreak").textContent=st;
  var risk=st>0&&!done&&new Date().getHours()>=18;$("stStreakL").textContent=risk?"streak ends tonight":"day streak";$("stStreakL").classList.toggle("risk",risk);
  $("stBar").style.width=(done+left?Math.round(done/(done+left)*100):0)+"%"}
function setDone(it,v){var k=dayKey(new Date());state.doneDays=state.doneDays||{};
  if(v&&!it.done){it.done=true;it.doneAt=new Date().toISOString();state.doneDays[k]=(state.doneDays[k]||0)+1;save();renderAll();reward(it)}
  else if(!v&&it.done){it.done=false;var dk=it.doneAt?dayKey(new Date(it.doneAt)):k;if(state.doneDays[dk]>0)state.doneDays[dk]--;it.doneAt=null;save();renderAll()}}
function chime(bonus){if(!ctx)return;tone(1047,0,.14,"sine",.25);tone(1319,.09,.14,"sine",.25);tone(1568,.18,.3,"sine",.25);
  if(bonus){tone(2093,.32,.18,"sine",.22);tone(2637,.44,.18,"sine",.2);tone(3136,.56,.5,"sine",.18)}}
var toastT=null;
function toast(text){var t=$("toast");t.textContent=text;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(function(){t.hidden=true},2600)}
function reward(it){arm();var today=dayKey(new Date()),n=state.doneDays[today];
  var left=state.items.filter(function(i){return !i.done&&i.when&&i.when.slice(0,10)<=today}).length;
  var cleared=left===0&&it.when&&it.when.slice(0,10)<=today,bonus=cleared||Math.random()<.2;
  chime(bonus);try{navigator.vibrate&&navigator.vibrate(bonus?[40,40,40,40,120]:[40])}catch(e){}
  toast(cleared?"Day cleared · streak "+streak():(bonus?"Bonus · ":"")+n+" done today · streak "+streak());
  if(cleared)speak("Day cleared.")}
function fill(box,items,emptyText){box.textContent="";if(!items.length){box.appendChild(el("div","empty",emptyText));return}items.forEach(function(i){box.appendChild(itemRow(i))})}
function renderAll(){
  renderTasks();
  renderCal();
  var n=state.items.length;$("memStat").textContent=n+" item"+(n===1?"":"s")+" and "+state.sessions.length+" start-up"+(state.sessions.length===1?"":"s")+" remembered on this device"+(storageOK?".":". This browser is blocking storage, so memory will not survive closing the page.");
  var log=$("log");log.textContent="";state.sessions.slice(-12).reverse().forEach(function(s){log.appendChild(el("div",null,"up "+fmtStamp(s.opened)+"  →  down "+(s===session?"running":fmtStamp(s.closed))))});
  $("btnClearEx").hidden=!state.items.some(function(i){return i.example});
}
function renderCal(){
  var y=view.getFullYear(),m=view.getMonth();$("calTitle").textContent=view.toLocaleDateString(undefined,{month:"short",year:"numeric"});
  var cal=$("cal");cal.textContent="";["M","T","W","T","F","S","S"].forEach(function(w){cal.appendChild(el("div","wd",w))});
  var by={};state.items.forEach(function(i){if(i.when&&!i.done){var k=i.when.slice(0,10);(by[k]=by[k]||[]).push(i)}});
  var first=new Date(y,m,1),start=new Date(y,m,1-((first.getDay()+6)%7)),today=dayKey(new Date());
  for(var n=0;n<42;n++){(function(d){
    var k=dayKey(d),b=el("button","day"+(d.getMonth()!==m?" out":"")+(k===today?" today":"")+(k===selected?" sel":""));b.type="button";
    b.appendChild(el("span",null,String(d.getDate())));var ds=el("span","ds");
    (by[k]||[]).sort(function(a,c){return rank(a.tier)-rank(c.tier)}).slice(0,3).forEach(function(i){ds.appendChild(el("i",i.tier))});b.appendChild(ds);
    b.setAttribute("aria-label",d.toDateString()+", "+(by[k]?by[k].length:0)+" items");
    b.addEventListener("click",function(){selected=k;renderCal()});
    cal.appendChild(b)})(new Date(start.getFullYear(),start.getMonth(),start.getDate()+n))}
  var sd=new Date(selected+"T00:00");$("dayTitle").textContent=sd.toLocaleDateString(undefined,{weekday:"long",day:"numeric",month:"long"});
  fill($("dayList"),state.items.filter(function(i){return i.when&&i.when.slice(0,10)===selected}).sort(function(a,b){return a.when<b.when?-1:1}),"Nothing on this day.");
}
function renderTiers(){var box=$("tiers");box.textContent="";
  Object.keys(TIERS).forEach(function(t){
    var row=el("div","tier");row.appendChild(el("span","dot "+t));var body=el("div");
    body.appendChild(el("b",null,TIERS[t].name));body.appendChild(el("small",null,TIERS[t].desc));
    var r=el("div","row"),name=soundName(t);
    r.appendChild(btn("Play","btn sm",function(){arm();playTier(t)}));
    var inp=el("input");inp.type="file";inp.accept="audio/*";inp.id="snd-"+t;inp.hidden=true;
    var lab=el("label","btn sm",name?"Change sound":"Choose sound");lab.htmlFor=inp.id;
    var note=el("span","me",name||"Built-in tone");note.style.cssText="font-family:var(--mono);font-size:11.5px;color:var(--muted);overflow-wrap:anywhere;min-width:0";
    inp.addEventListener("change",function(){if(inp.files[0])setCustom(t,inp.files[0],function(err){if(err){note.textContent=err}else renderTiers()})});
    r.appendChild(lab);r.appendChild(inp);
    if(name)r.appendChild(btn("Reset","btn sm",function(){try{localStorage.removeItem(SND+t)}catch(e){}delete custom[t];renderTiers()}));
    body.appendChild(r);body.appendChild(note);row.appendChild(body);box.appendChild(row)})}

/* ---------- dump: Claude files it, with a plain fallback ---------- */
var sampleCap=null;
function say(text,loud){var s=$("say");s.hidden=!text;s.textContent=text||"";if(loud)speak(text)}
function localParse(text){var d=null,n=new Date(),m;
  if((m=/\bin (\d+)\s*(min|minute|minutes|hr|hrs|hour|hours)\b/i.exec(text))){d=new Date(n.getTime()+(+m[1])*(/^h/i.test(m[2])?36e5:6e4))}
  else{var day=/\btomorrow\b/i.test(text)?1:/\b(today|tonight)\b/i.test(text)?0:null;
    m=/\b(?:at\s+)?(\d{1,2})(?::(\d{2}))?\s*(am|pm)\b/i.exec(text)||/\bat\s+(\d{1,2})(?::(\d{2}))?\b/i.exec(text);
    if(m||day!==null){d=new Date(n);d.setDate(d.getDate()+(day||0));var h=m?+m[1]:9;if(m&&m[3]){h=h%12+(/pm/i.test(m[3])?12:0)}
      d.setHours(h,m&&m[2]?+m[2]:0,0,0);if(day===null&&d<n)d.setDate(d.getDate()+1)}}
  return d?localISO(d):null}
function addItems(list,forceWhen,forceTier){var added=[];
  list.forEach(function(r){if(!r||!r.title)return;var tier=forceTier!=="auto"?forceTier:(TIERS[r.tier]?r.tier:"light");
    var when=forceWhen||(typeof r.when==="string"&&/^\d{4}-\d\d-\d\dT\d\d:\d\d/.test(r.when)?r.when.slice(0,16):null);
    var it={id:uid(),title:String(r.title).slice(0,120),note:String(r.note||"").slice(0,400),when:when,tier:tier,done:false,fired:{},createdAt:new Date().toISOString()};
    state.items.push(it);added.push(it)});
  save();if(added[0]&&added[0].when){selected=added[0].when.slice(0,10);view=new Date(selected+"T00:00")}renderAll();return added}
function fileIt(){
  var text=$("dump").value.trim();if(!text){say("Type a thought first.");return}
  var forceWhen=null,forceTier="auto",b=$("btnDump");
  function finish(){$("dump").value="";b.disabled=false;b.textContent="File it";check()}
  function fallback(why){var a=addItems([{title:text.split(/\n/)[0],note:"",when:localParse(text),tier:"light"}],forceWhen,forceTier)[0];
    say((why?why+" ":"")+"Filed as "+TIERS[a.tier].name.toLowerCase()+(a.when?" for "+fmtWhen(a.when):" with no time slot")+".",true);finish()}
  if(!sampleCap){fallback("");return}
  b.disabled=true;b.textContent="Thinking…";
  var n=new Date(),upcoming=state.items.filter(function(i){return !i.done&&!i.example&&i.when&&i.when>=localISO(n)}).slice(0,20).map(function(i){return i.when+" "+i.title});
  var prompt="You are Mercury, a personal assistant filing one person's brain dump into reminders.\n"+
    "Local time now: "+localISO(n)+" ("+n.toLocaleDateString("en",{weekday:"long"})+"), timezone "+(Intl.DateTimeFormat().resolvedOptions().timeZone||"local")+".\n"+
    "Already scheduled:\n"+(upcoming.join("\n")||"nothing")+"\n\n"+
    "Dump:\n\"\"\"\n"+text.slice(0,4000)+"\n\"\"\"\n\n"+
    "Split the dump into separate items. Priority tiers: \"high\" = a time-critical commitment that must not be missed; \"medium\" = something to look out for later; \"light\" = a suggestion, a tip someone gave, or an idea with no deadline.\n"+
    "\"when\" is local time as YYYY-MM-DDTHH:mm, or null when no date or time is implied. A date with no time gets 09:00. Never invent a time for a plain suggestion.\n"+
    "Reply with JSON only, in this shape: {\"items\":[{\"title\":\"short imperative title, 60 characters at most\",\"note\":\"extra detail or empty string\",\"when\":\"YYYY-MM-DDTHH:mm or null\",\"tier\":\"high|medium|light\"}],\"reply\":\"spoken aloud, 12 words at most, precise and formal like an academic, no greeting or filler: only what was filed and any clash\"}";
  sampleCap.json(prompt,{cache:false}).then(function(res){
    var items=res&&Array.isArray(res.items)?res.items:[];if(!items.length){fallback("");return}
    var added=addItems(items,items.length===1?forceWhen:null,forceTier);
    say((res.reply&&String(res.reply))||("Filed "+added.length+" item"+(added.length===1?"":"s")+"."),true);finish()
  }).catch(function(e){var c=e&&e.code;
    if(c==="not_granted"||c==="sampling_disabled"||c==="not_declared"){sampleCap=null;paintClaude()}
    fallback(c==="rate_limited"?"Claude is busy, so I filed it as written.":"Claude did not answer, so I filed it as written.")})
}
var toggleMic=null;
function wireMic(d){var mic=$("btnMic"),on=false,heard=false;mic.hidden=false;$("micHint").hidden=true;
  d.onFinal(function(p){var t=$("dump");t.value=(t.value?t.value.replace(/\s*$/," "):"")+p.text;heard=true});
  d.onState(function(s){var was=on;on=s.state==="listening";mic.textContent=on?"Stop and file":"Speak";mic.classList.toggle("go",on);
    if(was&&!on&&heard&&$("dump").value.trim()){heard=false;fileIt()}});
  toggleMic=function(){showTab("dump");if(on){d.stop().catch(function(){})}else{heard=false;d.start().catch(function(e){if(e&&e.code==="not_granted"){mic.hidden=true;$("micHint").hidden=false}})}};
  mic.addEventListener("click",function(){arm();toggleMic()})}
/* Headphone button: play/pause on the headset starts and stops voice input while Mercury is open. */
var keep=null;
function headset(){if(keep||!navigator.mediaSession)return;
  try{var n=8000,buf=new ArrayBuffer(44+n),v=new DataView(buf),w=function(o,t){for(var i=0;i<t.length;i++)v.setUint8(o+i,t.charCodeAt(i))};
    w(0,"RIFF");v.setUint32(4,36+n,true);w(8,"WAVEfmt ");v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,8000,true);v.setUint32(28,8000,true);v.setUint16(32,1,true);v.setUint16(34,8,true);w(36,"data");v.setUint32(40,n,true);
    for(var i=0;i<n;i++)v.setUint8(44+i,128);
    keep=new Audio(URL.createObjectURL(new Blob([buf],{type:"audio/wav"})));keep.loop=true;keep.play().catch(function(){});
    navigator.mediaSession.metadata=new MediaMetadata({title:"Mercury",artist:"Press play to speak"});
    var press=function(){keep.play().catch(function(){});if(toggleMic)toggleMic()};
    ["play","pause","stop","nexttrack"].forEach(function(a){try{navigator.mediaSession.setActionHandler(a,press)}catch(e){}})}catch(e){}}
function showTab(name){["dump","schedule","calendar","setup"].forEach(function(t){$("tab-"+t).hidden=t!==name});
  [].forEach.call(document.querySelectorAll(".tab"),function(b){var on=b.getAttribute("data-tab")===name;b.classList.toggle("on",on);b.setAttribute("aria-selected",on)});
  try{localStorage.setItem("mercury.tab",name)}catch(e){}}
function paintClaude(){$("pClaude").textContent=sampleCap?"Claude linked":"Claude offline · filing as written";$("pClaude").classList.toggle("on",!!sampleCap)}

/* ---------- memory file in and out ---------- */
var dlCap=null;
function exportMem(){stampClose();var data=JSON.stringify(state,null,2);
  function show(){var o=$("jsonOut");o.hidden=false;o.value=data;o.focus();o.select();
    try{navigator.clipboard.writeText(data).then(function(){$("memStat").textContent="Copied the memory JSON. Paste it into a file to keep it."},function(){})}catch(e){}}
  if(dlCap){dlCap.save({filename:"mercury-memory.json",data:data}).then(function(){$("memStat").textContent="Saved mercury-memory.json."}).catch(function(e){if(!e||e.code!=="declined")show()});return}
  if(!window.claude){try{var a=el("a");a.href=URL.createObjectURL(new Blob([data],{type:"application/json"}));a.download="mercury-memory.json";document.body.appendChild(a);a.click();a.remove();return}catch(e){}}
  show()}
function importMem(file){var fr=new FileReader();fr.onload=function(){try{var o=JSON.parse(fr.result);if(!o||!Array.isArray(o.items))throw 0;
    o.sessions=(o.sessions||[]).filter(function(s){return s.opened!==session.opened});o.sessions.push(session);o.settings=o.settings||state.settings;state=o;save();renderAll();paintVoice();
    $("memStat").textContent="Loaded "+o.items.length+" items from "+file.name+"."}catch(e){$("memStat").textContent="That file is not a Mercury memory file."}};fr.readAsText(file)}

/* ---------- winged shoe, dot matrix ---------- */
function glyph(){var rows=[
  "#.....................",
  "##..#.................",
  "###.##..#.............",
  ".######.##............",
  "..#########...........",
  "...########..####.....",
  "....#######..#####....",
  "......#####..#####....",
  ".........##..######...",
  "........###########...",
  "........#############.",
  "........##############",
  "........##############",
  "........rrrrrrrrrrrrrr"],g=$("glyph"),ns="http://www.w3.org/2000/svg";
  rows.forEach(function(r,y){for(var x=0;x<r.length;x++){if(r[x]==="."){continue}var c=document.createElementNS(ns,"circle");
    c.setAttribute("cx",x+2.5);c.setAttribute("cy",y+6.5);c.setAttribute("r",.4);c.setAttribute("fill",r[x]==="r"?"#e0202a":"#f3f3f0");g.appendChild(c)}})}

/* ---------- boot ---------- */
function tick(){var n=new Date();$("clock").textContent=pad(n.getHours())+":"+pad(n.getMinutes())}
function start(){
  load();glyph();openSession();renderTiers();renderAll();paintVoice();tick();
  $("btnDump").addEventListener("click",function(){arm();fileIt()});

  $("voiceSel").addEventListener("change",function(){state.settings.voiceName=this.value;save()});

  $("calPrev").addEventListener("click",function(){view=new Date(view.getFullYear(),view.getMonth()-1,1);renderCal()});
  $("calNext").addEventListener("click",function(){view=new Date(view.getFullYear(),view.getMonth()+1,1);renderCal()});
  $("rewardTest").addEventListener("click",function(){arm();chime(false)});

  $("btnClearEx").addEventListener("click",function(){state.items=state.items.filter(function(i){return !i.example});save();renderAll()});
  [].forEach.call(document.querySelectorAll(".tab"),function(b){b.addEventListener("click",function(){showTab(b.getAttribute("data-tab"))})});
  var t0="dump";try{t0=localStorage.getItem("mercury.tab")||"dump"}catch(e){}showTab($("tab-"+t0)?t0:"dump");

  }else paintClaude();
}
start();
})();
