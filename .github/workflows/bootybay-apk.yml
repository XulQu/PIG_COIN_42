name: BootyBay APK

on:
  push:
    paths:
      - 'etsy-test/**'
      - '.github/workflows/bootybay-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: etsy-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk BootyBay.apk
      - uses: actions/upload-artifact@v4
        with:
          name: BootyBay-apk
          path: etsy-test/BootyBay.apk
      - name: Publish to the "bootybay-latest" release (easy phone download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: bootybay-latest
          name: BootyBay (latest build)
          prerelease: true
          make_latest: false
          files: etsy-test/BootyBay.apk
          body: |
            Latest BootyBay build from `${{ github.ref_name }}` @ ${{ github.sha }}.
            Download BootyBay.apk on your phone and open it to install.
