name: Build Planetary Hours APK

on:
  push:
    paths:
      - 'planetary-hours-android/**'
      - '!planetary-hours-android/dist/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: planetary-hours-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: PlanetaryHours-apk
          path: planetary-hours-android/app/build/outputs/apk/debug/app-debug.apk
      - name: Commit the APK to the branch
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/PlanetaryHours.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/PlanetaryHours.apk
          git diff --cached --quiet || git commit -m "Build Planetary Hours APK"
          git push
